name: Apply DANA runtime and import layout fix

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-dana-runtime-and-import-layout.py
      - tests/rendered-html.test.mjs
      - .github/workflows/apply-dana-runtime-layout-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply runtime and layout patch
        run: python3 scripts/fix-dana-runtime-and-import-layout.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite and production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit completed repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/generate-voiceover/route.ts app/page.tsx app/modules.css
          git commit -m "Recover imported transcript runtime and improve import layout"
          git pull --rebase origin main
          git push origin HEAD:main
