name: Verify Visual Evidence Pass

on:
  push:
    branches: [feature/second-story-editorial-authorship]

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/second-story-editorial-authorship
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Visual Evidence Pass
        run: python3 scripts/apply-visual-evidence-pass.py
      - run: npm ci
      - run: node --test tests/visual-evidence-pass.test.mjs
      - run: node --test tests/default-editorial-brief.test.mjs tests/editorial-briefs.test.mjs tests/fifth-diner-voiceover.test.mjs tests/lepers-golden-master.test.mjs tests/lepers-mode.test.mjs tests/second-story-editorial-authorship.test.mjs
      - run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          if git diff --quiet app/page.tsx app/api/generate-voiceover/route.ts tests/default-editorial-brief.test.mjs tests/second-story-editorial-authorship.test.mjs; then
            echo "No generated patch changes to commit."
            exit 0
          fi
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/api/generate-voiceover/route.ts tests/default-editorial-brief.test.mjs tests/second-story-editorial-authorship.test.mjs
          git commit -m "Implement separate Visual Evidence Pass"
          git pull --rebase origin feature/second-story-editorial-authorship
          git push origin HEAD:feature/second-story-editorial-authorship
