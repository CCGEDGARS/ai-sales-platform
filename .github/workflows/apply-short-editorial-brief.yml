name: Apply compact editorial brief

on:
  push:
    branches: [feat/short-editorial-brief]
    paths:
      - scripts/apply-short-editorial-brief.py
      - tests/default-editorial-brief.test.mjs
      - .github/workflows/apply-short-editorial-brief.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/short-editorial-brief
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply compact editorial brief
        run: python3 scripts/apply-short-editorial-brief.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused editorial brief test
        run: node --test tests/default-editorial-brief.test.mjs

      - name: Run full regression suite and production build
        run: npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          if git diff --quiet app/page.tsx; then
            echo "No production changes required."
            exit 0
          fi
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Use compact Fifth Dinner Guest editorial brief"
          git pull --rebase origin feat/short-editorial-brief
          git push origin HEAD:feat/short-editorial-brief
