name: Finalize DANA Active Fifth Diner

on:
  push:
    branches:
      - dana-active-fifth-diner-v6-final
    paths:
      - '.github/workflows/finalize-fifth-diner.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dana-active-fifth-diner-v6-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply verified implementation commit
        run: git cherry-pick 7c415986a451cc31e64a1c9f9c2ac4bebbe70594
      - run: npm ci
      - name: Verify complete test suite
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Remove temporary finalizer and push
        shell: bash
        run: |
          git config user.name "DANA AI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/finalize-fifth-diner.yml
          git commit -m "chore: remove temporary fifth-diner finalizer"
          git push origin HEAD:dana-active-fifth-diner-v6-final
