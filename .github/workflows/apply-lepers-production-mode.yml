name: Apply Lepers production mode

on:
  push:
    branches: [dana-lepers-implementation9]
    paths:
      - app/lib/lepers-standard.ts
      - app/api/ingest-reference/route.ts
      - scripts/apply-lepers-production-mode.py
      - tests/lepers-mode.test.mjs
      - .github/workflows/apply-lepers-production-mode.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dana-lepers-implementation9
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply production patch
        run: python3 scripts/apply-lepers-production-mode.py

      - name: Install PDF reference parser
        run: npm install --save-exact pdf-parse@latest

      - name: Include all regression tests in release gate
        run: |
          npm pkg set 'scripts.test=node --test tests/*.test.mjs'
          npm pkg set 'scripts.build=node --test tests/*.test.mjs && next build'

      - name: Run complete test suite
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/api/generate-voiceover/route.ts app/api/ingest-reference/route.ts app/lib/lepers-standard.ts package.json package-lock.json tests/lepers-mode.test.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Add canonical Lepers production mode and real source ingestion"
          git pull --rebase origin dana-lepers-implementation9
          git push origin HEAD:dana-lepers-implementation9
