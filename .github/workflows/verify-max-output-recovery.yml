name: Verify max output recovery

on:
  push:
    branches: [fix/voiceover-max-output-recovery]

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voiceover-max-output-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply max output recovery fix
        run: python scripts/apply-max-output-recovery.py
      - run: npm ci
      - run: node --test tests/max-output-recovery.test.mjs tests/wow-creative-room.test.mjs tests/default-editorial-brief.test.mjs tests/editorial-briefs.test.mjs tests/fifth-diner-voiceover.test.mjs tests/lepers-golden-master.test.mjs tests/lepers-mode.test.mjs tests/second-story-editorial-authorship.test.mjs tests/visual-evidence-pass.test.mjs
      - run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/generate-voiceover/route.ts
          if ! git diff --cached --quiet; then
            git commit -m "Fix voice-over max output recovery"
            git push origin HEAD:fix/voiceover-max-output-recovery
          fi
