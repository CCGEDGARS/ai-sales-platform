name: Finalize DANA Active Fifth Diner

on:
  push:
    branches:
      - dana-active-fifth-diner-v6-final
    paths:
      - '.github/workflows/finalize-fifth-diner.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dana-active-fifth-diner-v6-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Materialize verified implementation tree
        shell: bash
        run: |
          git checkout 7c415986a451cc31e64a1c9f9c2ac4bebbe70594 -- \
            app/api/generate-voiceover/route.ts \
            app/lib/lepers-standard.ts \
            app/lib/lepers-golden-master.ts \
            app/lib/narrator-presence.ts \
            app/page.tsx \
            tests/narrator-presence-behaviour.test.mjs \
            tests/narrator-presence-gate.test.mjs
      - run: npm ci
      - name: Verify focused narrator-presence tests
        run: node --experimental-strip-types --test tests/narrator-presence-behaviour.test.mjs tests/narrator-presence-gate.test.mjs
      - name: Verify complete test suite
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Commit clean verified implementation and remove finalizer
        shell: bash
        run: |
          git config user.name "DANA AI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/finalize-fifth-diner.yml
          git add app/api/generate-voiceover/route.ts app/lib/lepers-standard.ts app/lib/lepers-golden-master.ts app/lib/narrator-presence.ts app/page.tsx tests/narrator-presence-behaviour.test.mjs tests/narrator-presence-gate.test.mjs
          git commit -m "feat: enforce active fifth dinner guest narrator presence"
          git push origin HEAD:dana-active-fifth-diner-v6-final
