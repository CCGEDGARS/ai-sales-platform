name: Fix DANA production security

on:
  push:
    paths:
      - ".github/workflows/fix-dana-security.yml"

permissions:
  contents: write

jobs:
  upgrade-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Upgrade patched framework and remove unused PDF library
        run: |
          npm install --save-exact next@16.3.2
          npm install --save-dev --save-exact eslint-config-next@16.3.2
          npm uninstall pdf-lib
      - name: Verify production build and regression suite
        run: npm test
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified security upgrade
        run: |
          if git diff --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js to patched 16.3.2"
          git push origin HEAD:main
