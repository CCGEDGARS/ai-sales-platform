name: Apply DANA background voice-over repair

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-dana-background-voiceover.py
      - app/api/generate-voiceover/route.ts
      - tests/rendered-html.test.mjs
      - .github/workflows/apply-dana-background-voiceover.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply frontend patch
        run: python3 scripts/patch-dana-background-voiceover.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite and production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit patched frontend
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No frontend changes required."
            exit 0
          fi
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Use durable background jobs for voice-over generation"
          git pull --rebase origin main
          git push origin HEAD:main
