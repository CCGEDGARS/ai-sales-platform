name: Fix DANA large video upload

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-dana-large-video-upload.py
      - .github/workflows/fix-dana-large-video-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add regression test first
        run: python3 scripts/fix-dana-large-video-upload.py --tests-only

      - name: Verify regression test fails before the fix
        shell: bash
        run: |
          set +e
          npm test
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the fix."
            exit 1
          fi
          echo "Regression reproduced as expected."

      - name: Apply root-cause fix
        run: python3 scripts/fix-dana-large-video-upload.py --apply

      - name: Run regression suite
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/api/gemini-upload-session/route.ts app/api/gemini-file-status/route.ts app/api/transcribe-uploaded/route.ts tests/rendered-html.test.mjs
          git commit -m "Fix large-video transcription upload path"
          git pull --rebase origin main
          git push origin HEAD:main
