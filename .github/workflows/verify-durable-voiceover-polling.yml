name: Verify durable voiceover polling

on:
  push:
    branches: [fix/durable-voiceover-polling]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/durable-voiceover-polling
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/durable-voiceover-polling.test.mjs
