name: Verify Second Story editorial authorship

on:
  push:
    branches: [feature/second-story-editorial-authorship]

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/second-story-editorial-authorship
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply legacy Second Story gate
        run: python3 scripts/apply-second-story-authorship.py
      - run: npm ci
      - run: node --test tests/second-story-editorial-authorship.test.mjs
      - run: node --test tests/default-editorial-brief.test.mjs tests/editorial-briefs.test.mjs tests/fifth-diner-voiceover.test.mjs tests/lepers-golden-master.test.mjs tests/lepers-mode.test.mjs
      - run: npm run build
      - name: Commit verified legacy gate
        shell: bash
        run: |
          if git diff --quiet app/api/generate-voiceover/route.ts; then
            echo "No production changes required."
            exit 0
          fi
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/generate-voiceover/route.ts
          git commit -m "Prevent legacy Second Story bypass"
          git pull --rebase origin feature/second-story-editorial-authorship
          git push origin HEAD:feature/second-story-editorial-authorship
