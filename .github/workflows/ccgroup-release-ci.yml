name: CCGROUP Release CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run release integrity tests first
        run: node --test tests/release-integrity-*.test.mjs
      - name: Run repository tests
        run: npm test
      - name: Install FFmpeg for audio verification
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
      - name: Install audio verification dependencies
        timeout-minutes: 3
        run: python -m pip install --retries 1 --timeout 30 -r services/ffmpeg-worker/requirements.txt
      - name: Verify real audio normalization including WhatsApp Opus
        timeout-minutes: 2
        run: python tests/audio_worker_test.py
      - name: Build production application
        run: npm run build
      - name: Check release JavaScript syntax
        run: |
          if [ -f scripts/release-integrity-core.mjs ]; then node --check scripts/release-integrity-core.mjs; fi
          if [ -f scripts/verify-release-integrity.mjs ]; then node --check scripts/verify-release-integrity.mjs; fi
