name: Apply transcript import repair

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-transcript-import.py
      - app/api/import-transcript/route.ts
      - package.json
      - tests/rendered-html.test.mjs
      - .github/workflows/apply-transcript-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply transcript import UI patch
        run: python3 scripts/patch-transcript-import.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite and production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit completed repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx package-lock.json
          git commit -m "Allow imported transcripts to continue to voice-over"
          git pull --rebase origin main
          git push origin HEAD:main
