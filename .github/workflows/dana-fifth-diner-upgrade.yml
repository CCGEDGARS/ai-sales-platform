name: DANA Fifth Diner Smoke Test

on:
  push:
    branches:
      - dana-active-fifth-diner-v6
    paths:
      - '.github/workflows/dana-fifth-diner-upgrade.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository checkout
        run: |
          test -f package.json
          echo "workflow-ok"
