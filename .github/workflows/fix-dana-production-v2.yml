name: Fix DANA production defects v2

on:
  push:
    paths:
      - ".github/workflows/fix-dana-production-v2.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply source repair
        run: python scripts/fix-dana-production.py

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build and run regression checks
        run: npm test

      - name: Commit verified fixes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/api/transcribe/route.ts app/layout.tsx package.json package-lock.json tests/rendered-html.test.mjs
          git commit -m "Fix DANA production persistence, drag-drop and PDF export"
          git push origin HEAD:main

# rerun: regression assertion corrected
