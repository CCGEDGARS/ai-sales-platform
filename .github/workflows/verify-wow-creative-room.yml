name: Verify WOW Creative Room

on:
  push:
    branches: [feature/wow-creative-room]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wow-creative-room
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/wow-creative-room.test.mjs
