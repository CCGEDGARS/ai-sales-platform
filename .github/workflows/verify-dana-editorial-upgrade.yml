name: Verify DANA editorial upgrade

on:
  push:
    branches: [feature/second-story-editorial-authorship]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/second-story-editorial-authorship
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/visual-evidence-pass.test.mjs tests/second-story-editorial-authorship.test.mjs tests/default-editorial-brief.test.mjs tests/editorial-briefs.test.mjs tests/fifth-diner-voiceover.test.mjs tests/lepers-golden-master.test.mjs tests/lepers-mode.test.mjs
      - run: npm run build
