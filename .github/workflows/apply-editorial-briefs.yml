name: Apply editorial brief behavior

on:
  push:
    branches: [dana-editorial-briefs]
    paths:
      - scripts/apply-editorial-briefs.py
      - .github/workflows/apply-editorial-briefs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dana-editorial-briefs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply behavior patch
        run: python3 scripts/apply-editorial-briefs.py
      - name: Install dependencies
        run: npm ci
      - name: Run complete regression suite
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/api/generate-voiceover/route.ts
          if git diff --cached --quiet; then
            echo "No implementation changes required."
            exit 0
          fi
          git commit -m "Make editorial briefs tone-specific and add Tailored mode"
          git pull --rebase origin dana-editorial-briefs
          git push origin HEAD:dana-editorial-briefs
