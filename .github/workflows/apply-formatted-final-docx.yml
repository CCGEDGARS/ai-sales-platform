name: Apply formatted final DOCX export

on:
  push:
    branches: [dana-formatted-final-docx]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate production-formatted final DOCX') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dana-formatted-final-docx
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply integration patch
        run: python scripts/apply-formatted-final-docx.py
      - name: Verify tests
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Commit verified integration
        run: |
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "Integrate production-formatted final DOCX"
            git push origin HEAD:dana-formatted-final-docx
          fi
