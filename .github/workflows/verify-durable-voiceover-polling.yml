name: Verify durable voiceover polling

on:
  push:
    branches: [fix/durable-voiceover-polling]

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/durable-voiceover-polling
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply durable polling fix
        run: python scripts/apply-durable-voiceover-polling.py
      - run: npm ci
      - run: node --test tests/durable-voiceover-polling.test.mjs tests/max-output-recovery.test.mjs tests/wow-creative-room.test.mjs tests/default-editorial-brief.test.mjs tests/editorial-briefs.test.mjs tests/fifth-diner-voiceover.test.mjs tests/lepers-golden-master.test.mjs tests/lepers-mode.test.mjs tests/second-story-editorial-authorship.test.mjs tests/visual-evidence-pass.test.mjs
      - run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Fix durable voice-over polling and resume"
            git push origin HEAD:fix/durable-voiceover-polling
          fi
