name: Apply workspace learning

on:
  push:
    branches: [dana-learning-profile-design]
    paths:
      - scripts/apply-workspace-learning.py
      - .github/workflows/apply-workspace-learning.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dana-learning-profile-design
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply implementation
        run: python3 scripts/apply-workspace-learning.py
      - name: Install dependencies
        run: npm ci
      - name: Run full regression suite
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Remove one-shot implementation artifacts
        run: rm -f scripts/apply-workspace-learning.py .github/workflows/apply-workspace-learning.yml
      - name: Commit verified implementation
        run: |
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build persistent workspace-wide DANA learning"
            git push origin HEAD:dana-learning-profile-design
          fi
