name: Verify WOW bypass guards

on:
  push:
    branches: [feature/wow-creative-room]

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wow-creative-room
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply WOW bypass closure
        run: python3 scripts/fix-wow-bypasses.py
      - run: npm ci
      - run: node --test tests/wow-creative-room.test.mjs tests/default-editorial-brief.test.mjs tests/editorial-briefs.test.mjs tests/fifth-diner-voiceover.test.mjs tests/lepers-golden-master.test.mjs tests/lepers-mode.test.mjs tests/second-story-editorial-authorship.test.mjs tests/visual-evidence-pass.test.mjs
      - run: npm run build
      - name: Commit verified fix
        shell: bash
        run: |
          if git diff --quiet app/api/generate-voiceover/route.ts; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/generate-voiceover/route.ts
          git commit -m "Close WOW release and correction bypasses"
          git pull --rebase origin feature/wow-creative-room
          git push origin HEAD:feature/wow-creative-room
