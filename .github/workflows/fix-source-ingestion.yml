name: Fix source ingestion

on:
  push:
    branches: [dana-source-add-fix]
    paths:
      - scripts/fix-source-ingestion.py
      - tests/source-ingestion.test.mjs
      - .github/workflows/fix-source-ingestion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dana-source-add-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply source ingestion repair
        run: python3 scripts/fix-source-ingestion.py
      - name: Install dependencies
        run: npm ci
      - name: Run regression suite
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "DANA AI maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/modules.css
          if git diff --cached --quiet; then
            echo "No implementation changes required."
            exit 0
          fi
          git commit -m "Fix source ingestion feedback and video registration"
          git pull --rebase origin dana-source-add-fix
          git push origin HEAD:dana-source-add-fix
